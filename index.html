function resetView(){document.getElementById('search').value='';current='';shown=false;render()}
function render(){renderCats();const q=document.getElementById('search').value.trim().toLowerCase();let rows=!shown?[]:data.filter(x=>mode==='search'?x.name.toLowerCase().includes(q)||x.cat.toLowerCase().includes(q)||x.ings.toLowerCase().includes(q):x.cat===current);document.getElementById('notice').style.display=rows.length||!shown?'block':'none';document.getElementById('notice').innerHTML=!shown?'เลือกหมวดสูตรหรือพิมพ์ค้นหา เพื่อเริ่มดูสูตร ☕':rows.length?'แตะการ์ดสูตรเพื่อดูรายละเอียด':'ไม่พบสูตรที่ค้นหา';document.getElementById('results').style.display=shown?'block':'none';document.getElementById('count').textContent=shown?`${rows.length} เมนู`:'';document.getElementById('list').innerHTML=rows.map(x=>`<article class="recipe" onclick="openDetail(${x.id})"><div class="rtop"><div class="drink">☕</div><div><h3>${esc(x.name)}</h3><span class="badge">${esc(x.size)} • ${esc(x.cat)}</span></div></div><div class="preview">${esc(x.ings.split('\n')[0])}</div></article>`).join('')||''}
function openDetail(id){const x=data.find(a=>a.id===id);if(!x)return;document.getElementById('detailTitle').textContent=x.name;document.getElementById('detailBody').innerHTML=`<b>ขนาด:</b> ${esc(x.size)}<br><b>หมวด:</b> ${esc(x.cat)}<br><br>${esc(x.ings)}${x.extra?'<br><br><b>วิธี/หมายเหตุ:</b> '+esc(x.extra):''}<hr><button class="save" onclick="openEditor(${x.id});closeModal('detailModal')">✏️ แก้ไขสูตรนี้</button>`;document.getElementById('detailModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function fillCats(){document.getElementById('cat').innerHTML=cats.map(c=>`<option>${c[0]}</option>`).join('')}
function openEditor(id=null){editId=id;let x=id?data.find(a=>a.id===id):null;document.getElementById('mt').textContent=id?'แก้ไขสูตร':'เพิ่มสูตร';document.getElementById('name').value=x?.name||'';document.getElementById('cat').value=x?.cat||current||cats[0][0];document.getElementById('size').value=x?.size||'16 oz.';document.getElementById('ings').value=x?.ings||'';document.getElementById('editModal').classList.add('show')}
function save(){let name=document.getElementById('name').value.trim(),cat=document.getElementById('cat').value,size=document.getElementById('size').value.trim(),ings=document.getElementById('ings').value.trim();if(!name||!ings){alert('กรุณาใส่ชื่อเมนูและสูตร');return}if(editId){let x=data.find(a=>a.id===editId);Object.assign(x,{name,cat,size,ings})}else data.push({id:Date.now(),name,cat,size,ings});localStorage.setItem('allCafeRecipesV4',JSON.stringify(data));closeModal('editModal');current=cat;shown=true;mode='cat';render()}
fillCats();render();
</script></body></html>
